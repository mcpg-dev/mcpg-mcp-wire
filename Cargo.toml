[package]
name = "mcpg-mcp-wire"
version = "0.1.0-rc.18"
edition = "2024"
license = "Apache-2.0"
description = "MCP wire types for revision 2026-07-28 (stateless) and its extensions"

[dependencies]
base64 = "0.23"
http = "1"
mcpg-standard-webhooks = { git = "https://github.com/mcpg-dev/mcpg-standard-webhooks", tag = "v0.1.0-rc.12", version = "=0.1.0-rc.12" }
metrics = "0.24"
schemars = { version = "1.2", default-features = false, features = ["derive", "preserve_order", "std"] }
serde = { version = "1", features = ["derive"] }
# preserve_order is load-bearing: param→header promotion resolves duplicate
# header names first-claimant-wins over the schema's own property order, so
# an alphabetical (BTreeMap) iteration changes which promotion survives.
serde_json = { version = "1", features = ["preserve_order"] }
# Exact: subscription ids hash this output, so a formatting change in an
# update must arrive as a reviewed bump, never through `cargo update`.
serde_json_canonicalizer = "=0.3.2"
tracing = "0.1"

[dev-dependencies]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
result_large_err = "allow"
large_enum_variant = "allow"
